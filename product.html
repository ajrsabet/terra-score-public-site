<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Platform | Product Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="product">
    <header class="navbar">
      <a class="brand" href="index.html"
        ><span class="brand-mark">PL</span><span>Platform</span></a
      >
      <button
        class="mobile-menu"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        Menu
      </button>
      <nav id="site-nav" class="nav-links" aria-label="Primary navigation">
        <a href="index.html" data-nav="about">About</a>
        <a href="index.html#support" data-nav="support">Support</a>
        <div class="nav-group">
          <button
            class="nav-dropdown-trigger"
            type="button"
            data-nav="demo"
            aria-expanded="false"
            aria-controls="platform-demo-menu"
          >
            Platform Demo
          </button>
          <div id="platform-demo-menu" class="nav-dropdown">
            <a href="product.html" data-nav="product">Product Page</a>
            <a href="comparison.html" data-nav="comparison">Product Comparison</a>
            <a href="research.html" data-nav="research">Research</a>
          </div>
        </div>
      </nav>
    </header>
    <main class="app-shell product-page-shell">
      <div class="top-controls">
        <select id="product-select" aria-label="Choose product"></select
        ><a class="button contained compare-link" href="comparison.html"
          >Compare products</a
        >
      </div>
      <section id="product-view" class="stack"></section>
    </main>
    <dialog id="info-dialog" class="info-dialog">
      <button class="dialog-close" type="button" aria-label="Close">x</button>
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
